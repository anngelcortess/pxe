name: jumpstart
type: jumpstart
mac: "08:00:27:00:00:01"
host_only_ip: "192.168.56.10"  # IP estática del adaptador Host-Only (enp0s8), fuera del rango DHCP VirtualBox (.101-.254)

# Conexión al servidor VBox API que corre en el Host
# Para adaptar a otro equipo: solo cambia el puerto si lo modificaste al instalar el servicio.
# La IP 192.168.56.1 es siempre la del Host en la red Host-Only de VirtualBox (no cambia).
host_api_url: "http://192.168.56.1:7070"   # ← Cambiar puerto si usas otro distinto

networks:
  - name: NAT
    type: NAT
  - name: intnet_main
    ip: "192.168.1.254"
    netmask: "255.255.255.0"
  - name: intnet_internal
    ip: "192.168.2.254"
    netmask: "255.255.255.0"
vbox_specs:
  cpus: 2
  ram_mb: 7168
  disk_gb: 30
