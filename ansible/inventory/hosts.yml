---
# ==============================================================
# GAR — Inventario Ansible
# IPs y grupos de todos los nodos de la maqueta.
# Usuario y clave SSH inyectados por el Jumpstart en la Fase 1.
# ==============================================================

all:
  vars:
    ansible_user: admin
    ansible_ssh_private_key_file: ~/.ssh/id_rsa
    ansible_python_interpreter: /usr/bin/python3

  children:

    # ── Red MAIN ─────────────────────────────────────────────
    load_balancer:
      hosts:
        load-balancer:
          ansible_host: 192.168.1.10

    web_frontends:
      hosts:
        web-frontend-1:
          ansible_host: 192.168.1.11
        web-frontend-2:
          ansible_host: 192.168.1.12

    hotdesks:
      hosts:
        hotdesk-1:
          ansible_host: 192.168.1.101
        hotdesk-2:
          ansible_host: 192.168.1.102
        hotdesk-3:
          ansible_host: 192.168.1.103
        hotdesk-4:
          ansible_host: 192.168.1.104
        hotdesk-5:
          ansible_host: 192.168.1.105
        hotdesk-6:
          ansible_host: 192.168.1.106
        hotdesk-7:
          ansible_host: 192.168.1.107
        hotdesk-8:
          ansible_host: 192.168.1.108

    # ── Red INTERNAL ─────────────────────────────────────────
    cluster:
      hosts:
        cluster-master-1:
          ansible_host: 192.168.2.11
        cluster-master-2:
          ansible_host: 192.168.2.12
        cluster-worker-1:
          ansible_host: 192.168.2.13
        cluster-worker-2:
          ansible_host: 192.168.2.14

    storage:
      hosts:
        storage-node:
          ansible_host: 192.168.2.20

    monitoring:
      hosts:
        monitoring:
          ansible_host: 192.168.2.30
